<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Run Walk Cycle</title>
<meta name="description" content="Free run/walk interval timer with an 8-week plan to 30 minutes non-stop. Voice cues, GPS distance and a share card.">
<meta name="theme-color" content="#F4F5F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Run Walk">
<meta property="og:title" content="Run Walk Cycle">
<meta property="og:description" content="Run, walk, repeat. A free interval timer that takes you to 30 minutes non-stop in 8 weeks.">
<meta property="og:image" content="https://ianyarko.github.io/run-walk-cycle/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app with four tabs (Today, Plan, History, Settings) in a fixed bottom bar; the live session is a full-screen overlay coloured by phase; details open as bottom sheets. */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --sunk:#E9ECE5; --ink:#141A16; --muted:#5D675F; --line:#DADFD6;
  --run:#E2531D; --run-soft:#FBE4DA; --walk:#13897A; --walk-soft:#D7EEEA; --easy:#B98A12; --on-phase:#FFFFFF; --accent:#E2531D;
  --good:#2F8A4E; --hard:#C23A2B;
  --shadow:0 12px 30px -16px rgba(20,26,22,.45);
  --f-num:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E110F; --surface:#171B18; --sunk:#1F2420; --ink:#E9EDE8; --muted:#97A198; --line:#2A302B;
  --run:#F0662F; --run-soft:#3A2016; --walk:#1FA796; --walk-soft:#12302B; --easy:#D3A52A; --on-phase:#FFFFFF; --accent:#F0662F;
  --good:#5CC27E; --hard:#F27766; --shadow:0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E110F; --surface:#171B18; --sunk:#1F2420; --ink:#E9EDE8; --muted:#97A198; --line:#2A302B;
  --run:#F0662F; --run-soft:#3A2016; --walk:#1FA796; --walk-soft:#12302B; --easy:#D3A52A; --on-phase:#FFFFFF; --accent:#F0662F;
  --good:#5CC27E; --hard:#F27766; --shadow:0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:16px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-num);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--run)} .brand em{font-style:normal;color:var(--walk)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted)}
.chip.hot{background:var(--run-soft);color:var(--run)}
.chip svg{width:14px;height:14px}
.h1{font-family:var(--f-num);font-weight:800;font-size:30px;line-height:1;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch h2{margin:0;font-size:15px;font-weight:700}
.ch .sub{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px;margin:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px}

/* Today hero */
.hero{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--run) 45%,transparent),transparent 70%);pointer-events:none}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.hero .title{font-family:var(--f-num);font-weight:800;font-size:clamp(34px,10vw,44px);line-height:.95;text-transform:uppercase}
.hero .title b{color:var(--run)} .hero .title i{font-style:normal;color:var(--walk)}
.hero .meta{display:flex;gap:16px;font-size:13px;opacity:.85}
.hero .meta b{font-family:var(--f-num);font-size:20px;display:block;line-height:1.1;opacity:1}
.strip{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.strip i{display:block;height:100%;min-width:2px}
.strip .run{background:var(--run)} .strip .walk{background:var(--walk)} .strip .warm,.strip .cool{background:var(--easy)}
.go{border:0;border-radius:16px;background:var(--run);color:#fff;font-family:var(--f-num);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:14px;position:relative;z-index:1}
.go:active{transform:scale(.99)}
.hero .alt{border:0;background:none;color:inherit;opacity:.75;font-size:13px;font-weight:600;text-decoration:underline;align-self:center;position:relative;z-index:1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.tile .tx{min-width:0}
.tile b{font-family:var(--f-num);font-size:26px;display:block;line-height:1}
.tile span{font-size:12px;color:var(--muted)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;background:conic-gradient(var(--walk) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring::before{content:"";width:38px;height:38px;border-radius:50%;background:var(--surface);grid-area:1/1}
.ring em{grid-area:1/1;font-style:normal;font-family:var(--f-num);font-weight:800;font-size:17px;z-index:1}
.flame{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;background:var(--run-soft);color:var(--run)}
.flame svg{width:28px;height:28px}

.lastrun{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.lastrun b{font-size:15px}
.lastrun small{color:var(--muted);font-size:12px}
.lastrun .big{font-family:var(--f-num);font-size:28px;font-weight:700;grid-row:span 2;text-align:right;line-height:1}
.lastrun .big span{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600}

/* pills */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:1px;background:var(--sunk);color:var(--muted)}
.pill.done{background:var(--walk-soft);color:var(--walk)}
.pill.easy{background:var(--walk-soft);color:var(--walk)} .pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)} .pill.hard{background:color-mix(in srgb,var(--hard) 16%,transparent);color:var(--hard)}

/* Plan */
.progbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--walk);border-radius:99px}
.weekblk{display:flex;flex-direction:column;gap:6px}
.weekblk h3{margin:6px 0 0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sess{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.sess .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:16px;background:var(--sunk);color:var(--muted)}
.sess.done .dot{background:var(--walk);color:#fff}
.sess.next{border-color:var(--run);box-shadow:0 0 0 2px color-mix(in srgb,var(--run) 25%,transparent)}
.sess.next .dot{background:var(--run);color:#fff}
.sess b{display:block;font-size:14px}
.sess small{color:var(--muted);font-size:12px}
.sess .r{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--muted)}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.presets::-webkit-scrollbar{display:none}
.preset{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left}
.preset b{display:block;font-size:14px}
.preset small{color:var(--muted);font-size:12px}
.preset[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.preset[aria-pressed="true"] small{color:inherit;opacity:.75}
.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:12px 6px}
.step label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.step.run label{color:var(--run)} .step.walk label{color:var(--walk)}
.step .val{font-family:var(--f-num);font-weight:800;font-size:34px;line-height:1}
.step .unit{font-size:12px;color:var(--muted);margin-top:-4px}
.step .pm{display:flex;gap:8px}
.step .pm button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;font-weight:600}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--run);color:#fff}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%}

/* History */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--run);min-height:3px}
.week i.zero{background:var(--line)}
.week span{font-size:11px;color:var(--muted)}
.week .today span{color:var(--ink);font-weight:700}
.pbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb{background:var(--sunk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pb span{font-size:12px;color:var(--muted);font-weight:600}
.pb b{font-family:var(--f-num);font-size:26px;line-height:1.05}
.pb small{font-size:11px;color:var(--muted)}
.runrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.runrow:first-child{border-top:0}
.runrow b{font-size:14px}
.runrow small{color:var(--muted);font-size:12px}
.runrow .r{text-align:right;font-family:var(--f-num);font-size:22px;font-weight:700;grid-row:span 2;align-self:center;line-height:1}
.runrow .r span{display:block;color:var(--muted);font-size:11px;font-family:var(--f-body);font-weight:600}

/* Settings */
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0}
.trow .lbl{font-weight:600;font-size:14px;min-width:0}
.trow .lbl small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.mini{display:flex;align-items:center;gap:6px;flex:none}
.mini button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.mini b{min-width:40px;text-align:center;font-family:var(--f-num);font-size:20px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--walk)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sep{height:1px;background:var(--line);margin:2px 0}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{max-width:540px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--run);background:var(--run-soft)}
nav.tabs svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,6,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0;font-family:var(--f-num);font-size:26px;text-transform:uppercase}
.splits{display:flex;flex-direction:column;gap:6px}
.split{display:grid;grid-template-columns:44px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.split i{display:block;height:10px;border-radius:99px;background:var(--walk)}
.split i.best{background:var(--run)}
.split b{font-family:var(--f-num);font-size:17px;text-align:right}

/* live screen */
.live{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:var(--on-phase);background:var(--run);transition:background .4s;overflow:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion: reduce){.live{transition:none}}
.live.walk{background:var(--walk)} .live.warm,.live.cool{background:var(--easy)} .live.paused{filter:saturate(.35) brightness(.85)}
.live .in{max-width:540px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:100%;gap:10px}
.lhead{display:flex;justify-content:space-between;font-weight:700;font-size:14px;opacity:.92}
.phase{font-family:var(--f-num);font-weight:800;font-size:clamp(60px,20vw,110px);line-height:.9;text-transform:uppercase;letter-spacing:.02em;margin-top:auto}
.count{font-family:var(--f-num);font-weight:700;font-size:clamp(92px,36vw,180px);line-height:.85;font-variant-numeric:tabular-nums}
.pbar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;border-radius:99px}
.nextup{font-size:16px;font-weight:600;opacity:.95}
.lstrip{display:flex;height:14px;gap:2px;border-radius:6px;overflow:hidden;margin-top:auto}
.lstrip i{display:block;height:100%;background:rgba(255,255,255,.3)}
.lstrip i.done{background:rgba(255,255,255,.85)}
.lstrip i.now{background:#fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.lstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;opacity:.95}
.lstats b{display:block;font-family:var(--f-num);font-size:24px;font-weight:700}
.gpsline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:12px;background:rgba(0,0,0,.14);border-radius:14px;padding:10px 12px}
.gpsline b{display:block;font-family:var(--f-num);font-size:26px;font-weight:700}
.lctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.lctl button{border:0;border-radius:16px;padding:16px 8px;font-weight:800;font-size:16px;background:rgba(255,255,255,.22);color:#fff}
.lctl .main{background:#fff;color:#141A16;font-family:var(--f-num);font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.confirm{background:rgba(0,0,0,.28);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-weight:600}
.confirm div{display:flex;gap:10px}
.confirm button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;background:#fff;color:#141A16}
.confirm button.ghost{background:rgba(255,255,255,.22);color:#fff}
.warnline{font-size:12px;opacity:.9;text-align:center}
.donebox{margin:auto 0;display:flex;flex-direction:column;gap:16px}
.donebox h2{font-family:var(--f-num);font-size:64px;line-height:.9;margin:0;text-transform:uppercase}
.feelrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:12px 6px;font-weight:800;font-size:15px}
.feel button[aria-pressed="true"]{background:#fff;color:#141A16;border-color:#fff}
.donemsg{font-weight:600;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-3 4 1 3 3 3 1M10 15l-2-1"/></svg>Today</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14l2 2 4-4"/></svg>Plan</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>History</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div id="live"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60);};
const mmssCeil=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60);};
const minLabel=m=>(Math.round(m*10)/10)+'';
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const km=m=>(m/1000).toFixed(2);
const paceStr=secPerKm=>secPerKm&&isFinite(secPerKm)?Math.floor(secPerKm/60)+':'+pad(Math.round(secPerKm%60))+' /km':'—';
const sayPace=secPerKm=>{const m=Math.floor(secPerKm/60),s=Math.round(secPerKm%60);return m+' minutes'+(s?' '+s:'')+' per kilometre';};
function toast(m){const h=$('#toastHost');h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600);}
const ICON_FLAME='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-3-2-5.5-3.5-7-.3 2-1.5 3-2.5 3 0-3-1-6-4-8 .4 3-1.5 5.5-3 7.5S5 13.5 5 15c0 4 3 7 7 7z"/></svg>';

/* ---------- the 8-week plan: [run min, walk min, rounds] ---------- */
const PROGRAM=[
 [1,2,8],[1,2,8],[1.5,2,7],
 [2,2,7],[2,2,7],[2.5,2,6],
 [3,2,6],[3,2,6],[3,1.5,6],
 [4,2,5],[4,2,5],[5,2,4],
 [5,2,4],[6,2,4],[6,1.5,4],
 [8,2,3],[8,2,3],[10,2,2],
 [10,1,3],[12,1,2],[12,1,2],
 [15,1,2],[20,0,1],[30,0,1]];
const progLabel=i=>'Week '+(Math.floor(i/3)+1)+' · Day '+(i%3+1);
const PRESETS=[
  {id:'start',name:'Starter',run:1,walk:2,rounds:8},
  {id:'build',name:'Builder',run:3,walk:2,rounds:6},
  {id:'five',name:'Five & two',run:5,walk:2,rounds:4},

/* ---------- settings (this device) ---------- */
const DEFAULT={custom:{run:5,walk:2,rounds:4},warm:true,warmMin:5,cool:true,coolMin:5,voice:true,beeps:true,halfway:true,kmCalls:true,gps:true,music:true,goal:3,prog:0};
const PKEY='runwalk.settings.v2';
let S=JSON.parse(JSON.stringify(DEFAULT));
try{const old=JSON.parse(localStorage.getItem('runwalk.plan.v1'));if(old){S.custom={run:old.run||5,walk:old.walk||2,rounds:old.rounds||4};['warm','warmMin','cool','coolMin','voice','beeps'].forEach(k=>{if(old[k]!=null)S[k]=old[k];});}}catch(e){}
try{const s=JSON.parse(localStorage.getItem(PKEY));if(s)S=Object.assign(S,s,{custom:Object.assign({},S.custom,s.custom||{})});}catch(e){}
const saveS=()=>{try{localStorage.setItem(PKEY,JSON.stringify(S));}catch(e){}};

function segments(x){
  const seg=[];
  if(S.warm)seg.push({t:'warm',s:S.warmMin*60});
  for(let i=1;i<=x.rounds;i++){seg.push({t:'run',s:x.run*60,r:i});if(x.walk>0&&(i<x.rounds||!S.cool))seg.push({t:'walk',s:x.walk*60,r:i});}
  if(S.cool)seg.push({t:'cool',s:S.coolMin*60});
  return seg;
}
const sessFromProg=i=>{const p=PROGRAM[Math.min(i,PROGRAM.length-1)];return {run:p[0],walk:p[1],rounds:p[2],prog:i,label:progLabel(Math.min(i,PROGRAM.length-1))};};
const sessFromCustom=()=>({run:S.custom.run,walk:S.custom.walk,rounds:S.custom.rounds,prog:null,label:'Custom'});
const sessTitle=x=>x.walk>0?'<b>'+minLabel(x.run)+' min run</b><br><i>'+minLabel(x.walk)+' min walk</i> ×'+x.rounds:'<b>'+minLabel(x.run)+' min run</b><br>non-stop';
const sessText=x=>x.walk>0?minLabel(x.run)+' run / '+minLabel(x.walk)+' walk ×'+x.rounds:minLabel(x.run)+' min non-stop';
function totals(x){let all=0,run=0;for(const s of segments(x)){all+=s.s;if(s.t==='run')run+=s.s;}return {all,run};}

/* ---------- run log: private claude.ai store, else this device ---------- */
const store={mode:'pending',col:null,runs:[]};
const LKEY='runwalk.log.v1';
function localRuns(){try{return JSON.parse(localStorage.getItem(LKEY))||[];}catch(e){return [];}}
async function initStore(){
  let db=null,user=null,id=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(user)id=await user.id();
    window.claude.use('downloads').then(d=>{store.downloads=d;}).catch(()=>{});}}catch(e){}
  if(db&&id){
    store.mode='db';store.col=db.doc('data/users/'+id+'/profile').collection('runs');
    store.col.orderBy('startedAt','desc').limit(500).onSnapshot(q=>{store.runs=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(!liveOn)render();},()=>{});
  }else{store.mode='local';store.runs=localRuns();if(!liveOn)render();}
}
async function saveRun(r){
  if(store.mode==='db'){const ref=store.col.doc();await ref.set(r);return ref.id;}
  const id='r'+Date.now().toString(36);const a=localRuns();a.unshift(Object.assign({id},r));try{localStorage.setItem(LKEY,JSON.stringify(a.slice(0,500)));}catch(e){}store.runs=a;return id;
}
async function updateRun(id,patch){
  if(store.mode==='db'){await store.col.doc(id).update(patch);return;}
  const a=localRuns();const r=a.find(x=>x.id===id);if(r)Object.assign(r,patch);try{localStorage.setItem(LKEY,JSON.stringify(a));}catch(e){}store.runs=a;
}

/* ---------- stats ---------- */
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function stats(){
  const runs=store.runs,now=new Date(),ws=weekStart(now).getTime();
  const thisWeek=runs.filter(r=>r.startedAt>=ws&&(r.runSec||0)>=60).length;
  // week streak: consecutive weeks that hit the goal (this week counts once it's hit)
  let streak=0;const goal=S.goal;
  const count=w=>runs.filter(r=>r.startedAt>=w&&r.startedAt<w+7*864e5&&(r.runSec||0)>=60).length;
  let w=ws;if(count(w)>=goal)streak++;w-=7*864e5;
  while(count(w)>=goal){streak++;w-=7*864e5;if(streak>200)break;}
  // personal bests
  const pb={};
  for(const r of runs){
    if((r.runSec||0)>(pb.mins?.v||0))pb.mins={v:r.runSec,d:r.startedAt};
    const block=(r.completed&&r.plan)?r.plan.run:0;if(block>(pb.block?.v||0))pb.block={v:block,d:r.startedAt};
    if((r.distM||0)>(pb.dist?.v||0))pb.dist={v:r.distM,d:r.startedAt};
    for(const sp of (r.splits||[]))if(!pb.km||sp<pb.km.v)pb.km={v:sp,d:r.startedAt};
  }
  const weeks={};for(const r of runs){const k=weekStart(new Date(r.startedAt)).getTime();weeks[k]=(weeks[k]||0)+(r.runSec||0);}
  for(const k in weeks)if(weeks[k]>(pb.week?.v||0))pb.week={v:weeks[k],d:+k};
  return {thisWeek,streak,pb};
}

}

/* ---------- run detail sheet + share card ---------- */

    '<p class="note" style="margin:-8px 0 0">'+esc(r.label||'')+(r.completed?'':' · stopped early')+feelPill(r.feel)+'</p>'+
    '<div class="pbs">'+pbBox('Running',mmss(r.runSec||0),'')+pbBox('Total time',mmss(r.totalSec||0),'')+pbBox('Distance',r.distM?km(r.distM)+' km':'—',r.distM?'':'No GPS on this run')+pbBox('Avg pace',r.distM?paceStr((r.totalSec||0)/(r.distM/1000)):'—','')+'</div>';
  if(sp.length)h+='<div><div class="ch" style="margin-bottom:6px"><h2>Kilometre splits</h2></div><div class="splits">'+sp.map((s,i)=>'<div class="split"><span>Km '+(i+1)+'</span><i class="'+(s===best?'best':'')+'" style="width:'+(40+60*(worst===best?1:(worst-s)/(worst-best))).toFixed(0)+'%"></i><b class="num">'+mmss(s)+'</b></div>').join('')+'</div></div>';
  h+='<div class="ch"><h2>How did it feel?</h2></div><div class="feelrow" id="rFeel">'+['easy','good','hard'].map(f=>'<button class="btn '+(r.feel===f?'':'ghost')+'" data-feel="'+f+'">'+({easy:'Easy',good:'Good',hard:'Hard'}[f])+'</button>').join('')+'</div>'+
    '<button class="btn block" id="rShare">Share this run</button></div></div>';
  $('#sheetHost').innerHTML=h;
  const close=()=>{$('#sheetHost').innerHTML='';};
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close();};$('#rClose').onclick=close;
  $('#rFeel').onclick=async e=>{const b=e.target.closest('[data-feel]');if(!b)return;try{await updateRun(r.id,{feel:b.dataset.feel});openRun(r.id);render();}catch(err){toast('Couldn’t save that. Try again.');}};
  $('#rShare').onclick=()=>shareRun(r);
}
function drawCard(r){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');

  g.fillStyle=ink;g.fillRect(0,0,W,H);
  const grad=g.createRadialGradient(W*.85,H*.12,10,W*.85,H*.12,W*.7);grad.addColorStop(0,'rgba(226,83,29,.55)');grad.addColorStop(1,'rgba(226,83,29,0)');g.fillStyle=grad;g.fillRect(0,0,W,H);
  const F='"Barlow Condensed","Arial Narrow",Arial,sans-serif',B='"Figtree",Arial,sans-serif';
  g.textBaseline='alphabetic';
  g.font='800 64px '+F;g.fillStyle=run;g.fillText('RUN',80,140);let x=80+g.measureText('RUN ').width;g.fillStyle=walk;g.fillText('WALK',x,140);x+=g.measureText('WALK ').width;g.fillStyle=paper;g.fillText('CYCLE',x,140);
  const d=new Date(r.startedAt);g.fillStyle='rgba(244,245,241,.8)';g.font='700 40px '+B;g.fillText(DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(),80,210);
  let sz=34,lbl=r.label||'';do{g.font='600 '+sz+'px '+B;sz-=2;}while(g.measureText(lbl).width>W-160&&sz>20);g.fillStyle='rgba(244,245,241,.6)';g.fillText(lbl,80,258);
  const big=r.distM?km(r.distM):String(Math.round((r.runSec||0)/60));
  g.font='800 360px '+F;g.fillStyle=paper;g.fillText(big,70,620);
  g.font='700 72px '+F;g.fillStyle=run;g.fillText(r.distM?'KILOMETRES':'MINUTES RUNNING',80,710);
  const stats=[['RUNNING',mmss(r.runSec||0)],['TOTAL',mmss(r.totalSec||0)],r.distM?['AVG PACE',paceStr((r.totalSec||0)/(r.distM/1000)).replace(' /km','')]:['CYCLE',(r.plan&&r.plan.walk>0)?r.plan.run+'/'+r.plan.walk:'NON-STOP']];
  stats.forEach((s,i)=>{const sx=80+i*320;g.font='600 34px '+B;g.fillStyle='rgba(244,245,241,.6)';g.fillText(s[0],sx,860);g.font='800 92px '+F;g.fillStyle=paper;g.fillText(s[1],sx,950);});
  // phase strip
  if(r.plan){const segs=[];for(let i=0;i<r.plan.rounds;i++){segs.push([run,r.plan.run]);if(r.plan.walk>0&&i<r.plan.rounds-1)segs.push([walk,r.plan.walk]);}
    const tot=segs.reduce((a,s)=>a+s[1],0);let sx=80;const sw=W-160;for(const s of segs){const w=s[1]/tot*sw-6;g.fillStyle=s[0];g.beginPath();g.roundRect(sx,1040,Math.max(4,w),34,10);g.fill();sx+=w+6;}}
  if(r.feel){g.font='700 40px '+B;g.fillStyle=paper;g.fillText('Felt: '+({easy:'Easy',good:'Good',hard:'Hard'}[r.feel]),80,1150);}
  g.font='600 34px '+B;g.fillStyle='rgba(244,245,241,.55)';g.fillText('Run. Walk. Repeat.',80,H-80);
  return c;
}
async function shareRun(r){
  const c=drawCard(r);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));const name='run-'+ymd(new Date(r.startedAt))+'.png';
  try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'My run'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  if(store.downloads){try{await store.downloads.save({filename:name,data:blob});toast('Saved. Post it on your WhatsApp status.');}catch(e){if(!e||e.code!=='declined')toast('Couldn’t save the picture.');}return;}
  try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}catch(e){toast('Couldn’t save the picture.');}
}

/* ---------- events ---------- */
$$('nav.tabs [data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);});
const LIMITS={run:[0.5,30,0.5],walk:[0,10,0.5],rounds:[1,20,1],warmMin:[1,15,1],coolMin:[1,15,1],goal:[1,7,1]};
$('#app').addEventListener('click',e=>{
  const st=e.target.closest('[data-start]');if(st){start(st.dataset.start==='prog'?sessFromProg(S.prog):sessFromCustom());return;}
  const tg=e.target.closest('[data-tabgo]');if(tg){tab=tg.dataset.tabgo;render();setTimeout(()=>{const c=$('#customCard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});},40);return;}
  const ss=e.target.closest('[data-sess]');if(ss){openSess(+ss.dataset.sess);return;}
  const p=e.target.closest('[data-preset]');if(p){const x=PRESETS.find(y=>y.id===p.dataset.preset);S.custom={run:x.run,walk:x.walk,rounds:x.rounds};saveS();render();return;}
  const s=e.target.closest('[data-step]');if(s){const k=s.dataset.step,[lo,hi,st2]=LIMITS[k];
    if(k in S.custom){S.custom[k]=Math.min(hi,Math.max(lo,Math.round((S.custom[k]+st2*Number(s.dataset.d))*10)/10));}
    else S[k]=Math.min(hi,Math.max(lo,Math.round((S[k]+st2*Number(s.dataset.d))*10)/10));
    saveS();render();return;}
  const rr=e.target.closest('[data-run]');if(rr){openRun(rr.dataset.run);return;}
  if(e.target.id==='resetPlan'){$('#resetConf').innerHTML='<div class="trow"><span class="note">Go back to Week 1, Day 1?</span><button class="btn" id="resetYes" style="padding:9px 12px">Yes, reset</button></div>';return;}
  if(e.target.id==='resetYes'){S.prog=0;saveS();tab='today';render();toast('Plan reset to Week 1');}
});
$('#app').addEventListener('change',e=>{const k=e.target.dataset.set;if(!k)return;S[k]=e.target.checked;saveS();render();});
function openSess(i){
  const x=sessFromProg(i),t=totals(x);
  $('#sheetHost').innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sT"><div class="ch"><h3 id="sT">'+progLabel(i)+'</h3><button class="btn ghost" id="sClose" style="padding:6px 12px">Close</button></div>'+
    '<p style="margin:-6px 0 0;font-weight:700;font-size:18px">'+esc(sessText(x))+'</p><div class="strip" aria-hidden="true">'+segments(x).map(s=>'<i class="'+s.t+'" style="flex:'+s.s+'"></i>').join('')+'</div>'+
    '<p class="note">'+mmss(t.run)+' running · '+mmss(t.all)+' total with warm-up and cool-down.</p>'+
    '<button class="btn block" id="sGo">Start this session</button>'+(i!==S.prog?'<button class="btn ghost block" id="sSet">Make this my next session</button>':'')+'</div></div>';
  const close=()=>{$('#sheetHost').innerHTML='';};
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close();};$('#sClose').onclick=close;
  $('#sGo').onclick=()=>{close();start(x);};
  if($('#sSet'))$('#sSet').onclick=()=>{S.prog=i;saveS();close();render();toast('Next up: '+progLabel(i));};
}

/* ---------- sound, voice, vibration, screen ---------- */
let ac=null,wake=null;
function audioMode(){try{if(navigator.audioSession)navigator.audioSession.type=S.music?'transient':'auto';}catch(e){}}
function beep(freq,dur,when){if(!S.beeps||!ac)return;try{const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
function say(text){if(!S.voice)return;try{const u=new SpeechSynthesisUtterance(text);u.rate=1;u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen');}catch(e){wake=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&liveOn&&run&&!run.paused)keepAwake();});

/* ---------- GPS ---------- */
const gps={watch:null,dist:0,last:null,splits:[],lastSplitT:0,fix:false};
function hav(a,b){const R=6371000,toR=x=>x*Math.PI/180,dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function gpsStart(){
  Object.assign(gps,{dist:0,last:null,splits:[],lastSplitT:0,fix:false});
  if(!S.gps||!('geolocation' in navigator))return;
  try{gps.watch=navigator.geolocation.watchPosition(onPos,err=>{gpsState=err.code===1?'denied':'unavailable';},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});}catch(e){gpsState='unavailable';}
}
function onPos(p){
  if(!run||run.done)return;const c=p.coords;gpsState='ok';
  if(c.accuracy>35)return;
  gps.fix=true;
  if(run.paused){gps.last=null;return;}
  const pt={lat:c.latitude,lon:c.longitude,t:elapsed()};
  if(gps.last){const d=hav(gps.last,pt),dt=Math.max(.5,pt.t-gps.last.t);
    if(d<3)return;
    if(d/dt>9){gps.last=pt;return;}
    gps.dist+=d;
    while(gps.dist>=(gps.splits.length+1)*1000){gps.splits.push(pt.t-gps.lastSplitT);gps.lastSplitT=pt.t;kmCall();}}
  gps.last=pt;
}
function gpsStop(){try{if(gps.watch!=null)navigator.geolocation.clearWatch(gps.watch);}catch(e){}gps.watch=null;}
function kmCall(){const n=gps.splits.length;if(!S.kmCalls)return;const pace=elapsed()/(gps.dist/1000);beep(990,.2);say(n+' kilometre'+(n===1?'':'s')+'. Average pace '+sayPace(pace)+'.');}

/* ---------- live session ---------- */
let liveOn=false,run=null,tick=null;
function start(x){
  $('#sheetHost').innerHTML='';audioMode();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();}catch(e){ac=null;}
  try{speechSynthesis.cancel();}catch(e){}
  const seg=segments(x);let acc=0;seg.forEach(s=>{s.at=acc;acc+=s.s;});
  run={x,seg,total:acc,startedAt:Date.now(),pausedMs:0,pauseAt:null,paused:false,lastIdx:-1,lastBeep:-1,skipMs:0,confirm:false,done:false,half:false};
  liveOn=true;keepAwake();gpsStart();
  tick=setInterval(step,200);step();
}
function elapsed(){if(!run)return 0;const now=run.paused?run.pauseAt:Date.now();return (now-run.startedAt-run.pausedMs+run.skipMs)/1000;}
function idxAt(t){for(let i=run.seg.length-1;i>=0;i--)if(t>=run.seg[i].at)return i;return 0;}
function step(){
  if(!run||run.done)return;
  const t=elapsed();
  if(t>=run.total){finish(true);return;}
  const i=idxAt(t),s=run.seg[i],left=s.at+s.s-t;
  if(i!==run.lastIdx){
    run.lastIdx=i;run.lastBeep=-1;
    beep(i===0?660:880,0.35);buzz([300,120,300]);
    const nx=s.t==='run'?(run.x.walk>0?'Run for '+minLabel(s.s/60)+' minutes':'Run '+minLabel(s.s/60)+' minutes, non-stop. You’ve got this.'):s.t==='walk'?'Walk for '+minLabel(s.s/60)+' minutes':s.t==='warm'?'Warm up. Walk briskly':'Cool down. Walk easy';
    say((s.r&&s.t==='run'&&run.x.rounds>1?'Round '+s.r+'. ':'')+nx);
  }
  if(S.halfway&&!run.half&&run.total>=240&&t>=run.total/2&&!run.paused){run.half=true;setTimeout(()=>say('Halfway. '+Math.round((run.total-t)/60)+' minutes to go.'),1200);}
  const whole=Math.ceil(left);
  if(!run.paused&&whole<=3&&whole>=1&&whole!==run.lastBeep&&i<run.seg.length-1){run.lastBeep=whole;beep(520,0.15);}
  renderLive(t,i,left);
}
function renderLive(t,i,left){
  const s=run.seg[i],nx=run.seg[i+1];
  const runDone=run.seg.reduce((a,y)=>a+(y.t==='run'?Math.max(0,Math.min(y.s,t-y.at)):0),0);
  const runsTotal=run.seg.filter(y=>y.t==='run').length;
  if(!$('#L')){
    $('#live').innerHTML='<div class="live" id="L" role="region" aria-label="Session in progress"><div class="in">'+
      '<div class="lhead"><span id="Lround"></span><span id="Lleft"></span></div>'+
      '<div class="phase" id="Lphase" aria-live="assertive"></div><div class="count" id="Lcount"></div>'+
      '<div class="pbar"><i id="Lbar"></i></div><div class="nextup" id="Lnext"></div>'+
      '<div class="lstrip" id="Lstrip" aria-hidden="true">'+run.seg.map(y=>'<i style="flex:'+y.s+'"></i>').join('')+'</div>'+
      '<div class="gpsline" id="Lgps"'+(S.gps?'':' hidden')+'><div><b class="num" id="Ldist">0.00</b>km</div><div><b class="num" id="Lpace">—</b>avg pace</div></div>'+
      '<div class="lstats"><div><b class="num" id="Lel"></b>Elapsed</div><div><b class="num" id="Lrun"></b>Running</div><div><b class="num" id="Lpct"></b>Done</div></div>'+
      '<div id="Lconf"></div>'+
      '<div class="lctl"><button id="Lstop">Stop</button><button class="main" id="Lpause">Pause</button><button id="Lskip">Skip</button></div>'+
      '<div class="warnline" id="Lwarn">Screen stays on while this is open.</div></div></div>';
    $('#Lpause').onclick=togglePause;$('#Lskip').onclick=skip;$('#Lstop').onclick=()=>{run.confirm=true;renderConf();};
  }
  $('#L').className='live '+s.t+(run.paused?' paused':'');
  $('#Lround').textContent=run.x.label+(s.r&&runsTotal>1?' · Round '+s.r+'/'+runsTotal:'');
  $('#Lleft').textContent=mmssCeil(run.total-t)+' left';
  $('#Lphase').textContent=run.paused?'Paused':({warm:'Warm up',run:'Run',walk:'Walk',cool:'Cool down'}[s.t]);
  $('#Lcount').textContent=mmssCeil(left);
  $('#Lbar').style.width=((1-left/s.s)*100).toFixed(1)+'%';
  $('#Lnext').textContent=nx?'Next: '+({warm:'Warm up',run:'Run',walk:'Walk',cool:'Cool down'}[nx.t])+' '+minLabel(nx.s/60)+' min':'Last stretch. Finish easy.';
  [...$('#Lstrip').children].forEach((el,k)=>el.className=k<i?'done':k===i?'now':'');
  $('#Lel').textContent=mmss(t);$('#Lrun').textContent=mmss(runDone);$('#Lpct').textContent=Math.floor(t/run.total*100)+'%';
  if(S.gps){$('#Ldist').textContent=km(gps.dist);$('#Lpace').textContent=gps.dist>=100?paceStr(t/(gps.dist/1000)).replace(' /km',''):'—';
    $('#Lwarn').textContent=gpsState==='denied'?'Location blocked: timing only for this run.':!gps.fix&&t>20?'Waiting for GPS. Timing still works.':'Screen stays on while this is open.';}
  $('#Lpause').textContent=run.paused?'Resume':'Pause';
}
function renderConf(){
  const c=$('#Lconf');if(!c)return;
  c.innerHTML=run.confirm?'<div class="confirm">Stop now? What you ran so far is saved.<div><button class="ghost" id="Cno">Keep going</button><button id="Cyes">Stop & save</button></div></div>':'';
  if(run.confirm){$('#Cno').onclick=()=>{run.confirm=false;renderConf();};$('#Cyes').onclick=()=>finish(false);}
}
function togglePause(){
  if(run.paused){run.pausedMs+=Date.now()-run.pauseAt;run.pauseAt=null;run.paused=false;gps.last=null;keepAwake();say('Go');}
  else{run.pauseAt=Date.now();run.paused=true;try{speechSynthesis.cancel();}catch(e){}}
  step();
}
function skip(){const t=elapsed(),i=idxAt(t),s=run.seg[i];run.skipMs+=(s.at+s.s-t)*1000+1;step();}
async function finish(completed){
  if(run.done)return;run.done=true;clearInterval(tick);gpsStop();
  const t=Math.min(elapsed(),run.total);
  const runSec=Math.round(run.seg.reduce((a,y)=>a+(y.t==='run'?Math.max(0,Math.min(y.s,t-y.at)):0),0));
  const x=run.x;
  const rec={startedAt:run.startedAt,label:x.label==='Custom'?sessText(x):x.label+' · '+sessText(x),totalSec:Math.round(t),runSec,completed,plan:{run:x.run,walk:x.walk,rounds:x.rounds},prog:x.prog,feel:null};
  if(gps.dist>=50){rec.distM=Math.round(gps.dist);rec.splits=gps.splits.map(s=>Math.round(s));}
  if(completed){beep(880,0.2);beep(1100,0.4,0.25);buzz([200,100,200,100,400]);say('Session complete. Well done.');}
  try{if(wake){wake.release();wake=null;}}catch(e){}
  let id=null,saved=true;if(t>=30){try{id=await saveRun(rec);rec.id=id;}catch(e){saved=false;}}else saved=null;
  const isPlan=completed&&x.prog!=null&&x.prog===S.prog;
  let feel=null,applied=false;
  const apply=()=>{if(applied||!isPlan)return;applied=true;if(feel!=='hard'){S.prog=Math.min(PROGRAM.length,S.prog+1);saveS();}};
  const msg=()=>!isPlan?'':feel==='hard'?'Felt hard? We’ll repeat '+progLabel(x.prog)+' next time. That’s how you build up.':x.prog+1>=PROGRAM.length?'That’s the whole plan. 30 minutes non-stop!':'Next up: '+progLabel(x.prog+1)+'.';
  const draw=()=>{
    $('#live').innerHTML='<div class="live '+(completed?'walk':'warm')+'" id="L2"><div class="in"><div class="donebox"><h2>'+(completed?'Done.':'Stopped.')+'</h2>'+
    '<div class="lstats"><div><b class="num">'+mmss(t)+'</b>Total</div><div><b class="num">'+mmss(runSec)+'</b>Running</div><div><b class="num">'+(rec.distM?km(rec.distM)+' km':'—')+'</b>'+(rec.distM?'Distance':'No GPS')+'</div></div>'+
    (saved===null?'<p class="donemsg">Under 30 seconds, so it wasn’t saved.</p>':saved?'':'<p class="donemsg">Couldn’t save this one. Check your connection.</p>')+
    (saved&&id?'<div><p class="donemsg" style="margin-bottom:8px">How did that feel?</p><div class="feel" id="Dfeel">'+['easy','good','hard'].map(f=>'<button data-feel="'+f+'" aria-pressed="'+(feel===f)+'">'+({easy:'Easy',good:'Good',hard:'Hard'}[f])+'</button>').join('')+'</div></div>':'')+
    (msg()?'<p class="donemsg" id="Dmsg">'+esc(msg())+'</p>':'')+
    '<div class="lctl" style="grid-template-columns:1fr 1fr">'+(saved&&id?'<button id="Dshare">Share</button>':'<span></span>')+'<button class="main" id="Lback">Done</button></div></div></div></div>';
    if($('#Dfeel'))$('#Dfeel').onclick=async e=>{const b=e.target.closest('[data-feel]');if(!b)return;feel=b.dataset.feel;rec.feel=feel;try{await updateRun(id,{feel});}catch(err){}draw();};
    if($('#Dshare'))$('#Dshare').onclick=()=>shareRun(rec);
    $('#Lback').onclick=()=>{apply();$('#live').innerHTML='';liveOn=false;run=null;tab='today';render();window.scrollTo(0,0);};
  };
  draw();
}

render();initStore();
})();
</script>
